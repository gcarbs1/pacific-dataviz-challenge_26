  .rul    { font:400 8px 'Outfit',sans-serif; }

  <!-- header -->
  <text x="420.0" y="106" class="title" text-anchor="middle">Where the <tspan class="w">rain</tspan> went</text>
  <text x="420.0" y="142" class="stand" text-anchor="middle">The climate crisis doesn’t just bring more heat: it redistributes the water.</text>
  <text x="420.0" y="162" class="stand" text-anchor="middle">Between the record’s first twenty years and its last twenty, the sky has tilted:</text>
  <text x="420.0" y="182" class="stand" text-anchor="middle">it now <tspan class="standb">floods the west and south</tspan> and <tspan class="standb">empties the dateline atolls</tspan>. Same ocean, different rain.</text>
  <text x="420.0" y="206" class="cap" text-anchor="middle">22 territories ordered by their shift, driest beneath the sun, clockwise round to wettest · the ocean lies inside the ring, the sky outside</text>

  <!-- sky corners -->
  <text x="44" y="356" class="anno" fill="#0e5f83">where the rain moved in</text><text x="44" y="390" class="bignum" fill="#0e5f83">15 <tspan class="terr">TERRITORIES</tspan></text><text x="44" y="406" class="biglab">NOW WETTER</text><text x="44" y="1006" class="call" fill="#22313b">Micronesia’s three wettest years in 47</text><text x="44" y="1020" class="call" fill="#22313b">years have all come since 2019. The</text><text x="44" y="1034" class="call" fill="#22313b">Solomons’ record fell in 2023 (+24.4%).</text><text x="800" y="356" class="anno" fill="#9a571c" text-anchor="end">where the rain is leaving</text><text x="800" y="390" class="bignum" fill="#9a571c" text-anchor="end">7 <tspan class="terr">TERRITORIES</tspan></text><text x="800" y="406" class="biglab" text-anchor="end">NOW DRIER</text><text x="796" y="992" class="call" fill="#22313b" text-anchor="end">Nauru’s sky has turned manic:</text><text x="796" y="1006" class="call" fill="#22313b" text-anchor="end"><tspan fill="#0e5f83" font-weight="600">+66.6%</tspan> in 2019, its wettest year</text><text x="796" y="1020" class="call" fill="#22313b" text-anchor="end">since 1979, then <tspan fill="#9a571c" font-weight="600">−48.0%</tspan> in 2022.</text>
