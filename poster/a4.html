  <!-- header -->
  <text x="420.0" y="106" class="title" text-anchor="middle">Where the <tspan class="w">rain</tspan> went</text>
  <text x="420.0" y="142" class="stand" text-anchor="middle">The climate crisis doesn’t just bring more heat: it redistributes the water.</text>
  <text x="420.0" y="162" class="stand" text-anchor="middle">Compared with the rain they knew in 1979–2000, the same sky that now <tspan class="standb">floods the western Pacific</tspan></text>
  <text x="420.0" y="182" class="stand" text-anchor="middle">is <tspan class="standb">emptying over the atolls of the centre</tspan>. Same ocean, different rain.</text>
  <text x="420.0" y="206" class="cap" text-anchor="middle">22 territories in west → east order around the ring · the ocean lies inside the ring, the sky outside</text>

  <!-- sky corners -->
  <text x="44" y="330" class="anno" fill="#0e5f83">the west fills up</text><text x="44" y="364" class="bignum" fill="#0e5f83">14</text><text x="44" y="380" class="biglab">TERRITORIES NOW WETTER</text><text x="44" y="1006" class="call" fill="#22313b">Micronesia’s three wettest years on</text><text x="44" y="1020" class="call" fill="#22313b">record have all come since 2019; the</text><text x="44" y="1034" class="call" fill="#22313b">Solomons’ record fell in 2023 (+24.4).</text><text x="800" y="366" class="anno" fill="#9a571c" text-anchor="end">the centre dries out</text><text x="800" y="400" class="bignum" fill="#9a571c" text-anchor="end">8</text><text x="800" y="416" class="biglab" text-anchor="end">TERRITORIES NOW DRIER</text><text x="800" y="440" class="call" fill="#22313b" text-anchor="end">Nauru’s sky has turned</text><text x="800" y="454" class="call" fill="#22313b" text-anchor="end">manic: <tspan fill="#0e5f83" font-weight="600">+66.6 mm</tspan> in 2019,</text><text x="800" y="468" class="call" fill="#22313b" text-anchor="end">its wettest year, then</text><text x="800" y="482" class="call" fill="#22313b" text-anchor="end"><tspan fill="#9a571c" font-weight="600">−48.0 mm</tspan> in 2022.</text>
