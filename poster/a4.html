  * { margin:0; padding:0; box-sizing:border-box; }

  .val    { font:700 13px 'Outfit',sans-serif; }
  .avg    { font:400 8.6px 'Outfit',sans-serif; }

  .sval   { font:700 10px 'Outfit',sans-serif; }
  .tiny   { font:400 9.3px 'Outfit',sans-serif; }
  .tinyb  { font:600 9.3px 'Outfit',sans-serif; letter-spacing:0.16em; }
  .rul    { font:400 8px 'Outfit',sans-serif; }
  .halo   { paint-order:stroke; stroke:#fbf7ee; stroke-width:3.5px; stroke-linejoin:round; }
  @page { size: 210mm 297mm; margin: 0; }
  /* 210mm = 793.7px, so the 840px sheet zooms by 793.7/840 to fill A4 exactly */
  @media print { body { background:none; padding:0; margin:0; } .sheet { box-shadow:none; zoom:0.94488; } }
</style>

  <!-- header -->
  <text x="420.0" y="106" class="title" text-anchor="middle">Where the <tspan class="w">rain</tspan> went</text>
  <text x="420.0" y="142" class="stand" text-anchor="middle">The climate crisis doesn’t just bring more heat: it redistributes the water.</text>
  <text x="420.0" y="162" class="stand" text-anchor="middle">Compared with the four decades to 2019, the same sky that now <tspan class="standb">floods the western Pacific</tspan></text>
  <text x="420.0" y="182" class="stand" text-anchor="middle">is <tspan class="standb">emptying over the atolls of the centre</tspan>. Same ocean, different rain.</text>
  <text x="420.0" y="206" class="cap" text-anchor="middle">22 territories ordered by their shift — driest beneath the sun, clockwise round to wettest · the ocean lies inside the ring, the sky outside</text>

  <!-- sky corners -->
  <text x="44" y="330" class="anno" fill="#0e5f83">the west fills up</text><text x="44" y="364" class="bignum" fill="#0e5f83">11</text><text x="44" y="380" class="biglab">TERRITORIES NOW WETTER</text><text x="44" y="1006" class="call" fill="#22313b">Micronesia’s three wettest years on</text><text x="44" y="1020" class="call" fill="#22313b">record have all come since 2019; the</text><text x="44" y="1034" class="call" fill="#22313b">Solomons’ record fell in 2023 (+24.4).</text><text x="800" y="366" class="anno" fill="#9a571c" text-anchor="end">the centre dries out</text><text x="800" y="400" class="bignum" fill="#9a571c" text-anchor="end">11</text><text x="800" y="416" class="biglab" text-anchor="end">TERRITORIES NOW DRIER</text><text x="796" y="992" class="call" fill="#22313b" text-anchor="end">Nauru’s sky has turned manic:</text><text x="796" y="1006" class="call" fill="#22313b" text-anchor="end"><tspan fill="#0e5f83" font-weight="600">+66.6 mm</tspan> in 2019, its wettest</text><text x="796" y="1020" class="call" fill="#22313b" text-anchor="end">year, then <tspan fill="#9a571c" font-weight="600">−48.0 mm</tspan> in 2022.</text>
